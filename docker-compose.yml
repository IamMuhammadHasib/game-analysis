services:
  app:
    image: node:24-alpine
    working_dir: /workspace
    ports:
      - "3000:3000"
    volumes:
      - ./:/workspace
      - node_modules:/workspace/node_modules
    environment:
      NODE_ENV: development
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  node_modules:
